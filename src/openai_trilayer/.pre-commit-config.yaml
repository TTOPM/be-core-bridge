repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.6.9
  hooks: [{id: ruff}]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.11.2
  hooks: [{id: mypy}]
- repo: https://github.com/psf/black
  rev: 24.8.0
  hooks: [{id: black}]
- repo: local
  hooks:
  - id: forbid-raw-openai
    name: Forbid direct OpenAI usage
    entry: python gateway/forbid_raw_openai.py
    language: system
