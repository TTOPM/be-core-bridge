openapi: 3.1.0
info:
  title: Belel Concordium Ledger API
  version: 1.0.0
paths:
  /attestations:
    get:
      summary: List attestations
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttestationRecord'
  /attestations/{hash}:
    get:
      summary: Get a single attestation by output hash
      parameters:
        - in: path
          name: hash
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationRecord'
components:
  schemas:
    AttestationRecord:
      type: object
      required: [attestation, concordium_decision]
      properties:
        attestation:
          type: object
          properties:
            ack_mandate: {type: boolean}
            anchors_match: {type: boolean}
            model: {type: string}
            continuity: {type: string}
            truth_lock: {type: boolean}
            prompt_sha256: {type: string}
            output_sha256: {type: string}
            timestamp: {type: string}
        concordium_decision:
          type: object
          properties:
            is_compliant: {type: boolean}
            violations: {type: array, items: {type: string}}
            notes: {type: string}
