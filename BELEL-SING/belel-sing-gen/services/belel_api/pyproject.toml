[project]
name = "belel_api"
version = "0.1.0"
description = "Belel Studio API gateway for BelelHyperEngine + BelelEditEngine"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "orjson>=3.10.0",
  "filelock>=3.15.4"
]

[tool.uvicorn]
factory = false

[tool.pytest.ini_options]
pythonpath = ["app"]
