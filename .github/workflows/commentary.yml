# .github/workflows/commentary.yml
name: Commentary Engine 🎙️

on:
  push:
    paths:
      - "media_sentient_engine.py"
      - ".github/workflows/commentary.yml"
      - "requirements.txt"
      - "canonical_config.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commentary:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: commentary-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyYAML || true

      - name: 🔎 Soft-check for canonical_config.json
        run: |
          if [ ! -f "canonical_config.json" ]; then
            echo "⚠️ canonical_config.json not found. Engine may skip or run with defaults."
          fi

      - name: 🚀 Run Commentary Engine
        shell: bash
        run: |
          set -euo pipefail
          FILE="media_sentient_engine.py"

          if [ -f "$FILE" ]; then
            export PYTHONPATH="$(pwd)/src:${PYTHONPATH:-}"
            echo "▶ Running $FILE"
            python "$FILE"
          else
            echo "⚠️ File not found: $FILE — skipping execution."
            exit 0
          fi
