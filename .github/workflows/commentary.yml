name: Commentary Engine 🎙️

on:
  push:
    paths:
      - "src/media/media_sentient_engine.py"
      - ".github/workflows/commentary.yml"

jobs:
  commentary:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Commentary Engine
        run: |
          FILE="src/media/media_sentient_engine.py"
          if [ -f "$FILE" ]; then
            export PYTHONPATH=$PYTHONPATH:$(pwd)/src
            python "$FILE"
          else
            echo "⚠️ File not found: $FILE — skipping execution."
          fi
            python "$FILE"
          else
            echo "⚠️ File not found: $FILE — skipping execution."
          fi
