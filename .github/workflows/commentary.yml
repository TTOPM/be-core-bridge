# .github/workflows/commentary.yml
name: Commentary Engine 🎙️

on:
  push:
    paths:
      - "media_sentient_engine.py"
      - "config/canonical_config.json"
      - "requirements.txt"
      - ".github/workflows/commentary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commentary:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: commentary-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: 📦 Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📁 Debug listing (quiet)
        shell: bash
        run: |
          set -euo pipefail
          echo "Repo root:"
          ls -la
          echo "config/:"
          ls -la config

      - name: 🚀 Run Commentary Engine
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          BELEL_CANONICAL_CONFIG: ${{ github.workspace }}/config/canonical_config.json
        run: |
          set -euo pipefail
          python -V
          python media_sentient_engine.py
