name: BELEL-SING Demo (Build + Push)

on:
  push:
    branches: ["main"]
    paths:
      - "BELEL-SING-DEMO/demo_public/**"
      - ".github/workflows/belel-sing-demo-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: meta
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER_LC/belel-sing-demo" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: BELEL-SING-DEMO/demo_public/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

      - name: Summary
        run: |
          echo "Pushed:"
          echo "  ${{ steps.meta.outputs.image }}:latest"
          echo "  ${{ steps.meta.outputs.image }}:${{ github.sha }}"
