name: Deploy BELEL-SING Demo (GitHub Pages)

on:
  push:
    branches: [ "main" ]
    paths:
      - "sing-demo-site/**"
      - ".github/workflows/belel-sing-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sing-demo-site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
