# .github/workflows/steward_self_heal.yml
name: Belel Steward Self-Heal

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 2 * * *"   # daily 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: self-heal-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run self-heal checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, json, pathlib
          ROOT = pathlib.Path(".")
          changed = False

          # Ensure PyYAML in requirements.txt
          req = ROOT / "requirements.txt"
          needed = {"PyYAML": "6.0.2"}
          if not req.exists():
              req.write_text("requests==2.31.0\nPyYAML==6.0.2\n")
              changed = True
          else:
              txt = req.read_text()
              def has_pkg(name):
                  return re.search(rf"(?im)^\s*{re.escape(name)}\b", txt) is not None
              for name, ver in needed.items():
                  if not has_pkg(name):
                      txt = txt.rstrip() + f"\n{name}=={ver}\n"
                      changed = True
              if changed:
                  req.write_text(txt)

          # Ensure canonical_config.json exists and is minimally valid
          cfg_path = ROOT / "canonical_config.json"
          default_cfg = {
              "watchlist": [
                  "BELEL_PROTOCOL_OVERVIEW.md",
                  "belel_guardian.py",
                  "media_sentient_engine.py",
                  "mutation_watcher.py",
                  "claim_review_publisher.py",
                  "concordium_enforcer.py"
              ],
              "hash_manifest": "checksums.txt",
              "policy": {
                  "license_required": "legal/BELEL-SOVEREIGN-LICENSE-v1.0.md",
                  "security_doc": "SECURITY.md",
                  "contributing_doc": "CONTRIBUTING.md"
              },
              "fail_on_missing": True,
              "notify_on_change": False
          }
          def valid(cfg):
              return isinstance(cfg, dict) and "watchlist" in cfg and "policy" in cfg

          try:
              if not cfg_path.exists():
                  cfg_path.write_text(json.dumps(default_cfg, indent=2))
                  changed = True
              else:
                  cfg = json.loads(cfg_path.read_text() or "{}")
                  if not valid(cfg):
                      cfg_path.write_text(json.dumps(default_cfg, indent=2))
                      changed = True
          except Exception:
              cfg_path.write_text(json.dumps(default_cfg, indent=2))
              changed = True

          # Output a value GitHub Actions can use
          (ROOT / "_SELF_HEAL_CHANGED").write_text("1" if changed else "0")
          print(f"SELF_HEAL_CHANGED={'1' if changed else '0'}")
          PY

      - name: Detect changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request (only if there are changes)
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/self-heal-${{ github.run_id }}
          title: "Self-heal: ensure PyYAML + canonical_config.json"
          body: "Automated fix to requirements.txt and canonical_config.json."
          commit-message: "chore(steward): self-heal requirements & canonical_config.json"
          labels: "automation,steward"
          delete-branch: true
