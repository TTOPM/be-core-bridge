name: Sync to Hugging Face

on:
  push:
    branches:
      - main  # or 'master' if that's your branch

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ✅ IMPORTANT: disable shallow clone

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs
          git lfs install

      - name: Set Git credentials
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Pearce Robinson"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Add remote only if it doesn't already exist
          git remote | grep -q hf || git remote add hf https://pearcerobinson:${HF_TOKEN}@huggingface.co/TTOPM/belel-protocol

          # Optional: Pull from Hugging Face to avoid push rejection
          git pull hf main --rebase || true

          # ⚠️ OMIT problematic file from Hugging Face push
          git rm --cached path/to/problematic_file.ext || true

          # Commit the removal for HF push only (won't affect GitHub)
          git commit -m "Temporarily remove problematic file for HF push" || true

          # ✅ Push forcefully to Hugging Face
          git push hf main --force
