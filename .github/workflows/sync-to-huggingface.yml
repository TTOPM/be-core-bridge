name: Sync to Hugging Face

on:
  push:
    branches:
      - main  # or 'master' if that's your branch

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensure full history for force push

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs
          git lfs install

      - name: Set Git credentials
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Pearce Robinson"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Add remote only if it doesn't already exist
          git remote | grep -q hf || git remote add hf https://pearcerobinson:${HF_TOKEN}@huggingface.co/TTOPM/belel-protocol
          
          # Optional: Pull from HF in case it has new commits (avoid push rejection)
          git pull hf main --rebase || true
          
          # Push forcefully to overwrite old commits
          git push hf main --force
