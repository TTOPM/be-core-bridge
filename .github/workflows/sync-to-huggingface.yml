name: Sync to Hugging Face

on:
  push:
    branches:
      - main  # or 'master' if that's your branch

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ✅ Keep: full history required

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs
          git lfs install

      - name: Set Git credentials
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Pearce Robinson"

      - name: Pull from Hugging Face to resolve conflicts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://pearcerobinson:${HF_TOKEN}@huggingface.co/TTOPM/belel-protocol || true
          git pull hf main --rebase || true

      - name: Remove binary files that are not tracked by LFS
        run: |
          git reset HEAD audio/belel_entry_response.wav || true
          git rm --cached audio/belel_entry_response.wav || true

      - name: Commit changes after conflict resolution
        run: |
          git add .
          git commit -m "Resolve conflicts and remove LFS-rejected files" || echo "Nothing to commit"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push hf main --force

