name: Sync to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🧬 Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: 🔐 Set Git Identity
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Pearce Robinson"

      - name: 🌐 Add HF Remote & Pull (Ignore Missing LFS Objects)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote | grep hf || git remote add hf https://pearcerobinson:${HF_TOKEN}@huggingface.co/TTOPM/belel-protocol

          # Avoid LFS smudge errors
          git lfs install --skip-smudge
          git pull hf main --rebase || echo "Skipping LFS error on pull"

      - name: 🧹 Configure Git LFS & Remove Orphaned Binary Files
        run: |
          git lfs track "*.wav" || true
          echo "*.wav filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
          git add .gitattributes || true

          # Prevent breaking if file already gone
          if [ -f audio/belel_entry_response.wav ]; then
            git rm --cached audio/belel_entry_response.wav || true
          fi

          git add .
          git commit -m "Configure LFS and cleanup orphaned binaries" || echo "Nothing to commit"

      - name: 🚀 Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push hf main --force-with-lease || echo "Push failed. Manual review may be needed."

