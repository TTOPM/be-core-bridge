name: Commentary Engine 🧠

on:
  push:
    paths:
      - 'commentary/**'
      - 'media_sentient_engine.py'
      - '.github/workflows/commentary-engine.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  commentary:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧠 Run Belel Commentary Engine
        run: |
          python media_sentient_engine.py

      - name: 🔐 Set Git Identity
        run: |
          git config --global user.email "contactme@pearcerobinson.com"
          git config --global user.name "Pearce Robinson"

      - name: 📤 Commit & Push Updates
        run: |
          git add .
          git commit -m "🧠 Commentary update via engine" || echo "Nothing to commit"
          git push origin main || echo "Nothing to push"

      - name: 🚀 Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://pearcerobinson:${HF_TOKEN}@huggingface.co/TTOPM/belel-protocol || true
          git push hf main --force || echo "Already up to date"
