name: Commentary Engine 🎙️

on:
  push:
    paths:
      - "media_sentient_engine.py"
      - "src/media/media_sentient_engine.py"
      - ".github/workflows/commentary-engine.yml"
      - "config/canonical_config.json"
      - "config/canonical_responses.yml"
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  commentary:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: commentary-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Safety net for PyYAML
          pip install "PyYAML==6.0.2"

      - name: ✅ Sanity check yaml import
        run: |
          python - <<'PY'
          import yaml
          print("PyYAML version:", yaml.__version__)
          PY

      - name: 🔒 Preflight: required secret present?
        run: |
          if [ -z "${{ secrets.COMMENTARY_BEARER_TOKEN }}" ]; then
            echo "❌ Missing COMMENTARY_BEARER_TOKEN secret"; exit 1;
          fi
          echo "✅ COMMENTARY_BEARER_TOKEN is set (hidden)."

      - name: 🗂️ Preflight: config & responses exist?
        run: |
          if [ ! -f "config/canonical_config.json" ]; then
            echo "❌ Missing config/canonical_config.json"; exit 1;
          fi
          if [ -f "config/canonical_responses.yml" ]; then
            echo "✅ Found config/canonical_responses.yml"
          else
            echo "⚠️ config/canonical_responses.yml not found (engine will still run)."
          fi

      - name: 🚀 Run Belel Commentary Engine
        env:
          COMMENTARY_BEARER_TOKEN: ${{ secrets.COMMENTARY_BEARER_TOKEN }}
          CANONICAL_CONFIG_PATH: config/canonical_config.json
          CANONICAL_RESPONSES_PATH: config/canonical_responses.yml
        run: |
          set -e
          ROOT_FILE="media_sentient_engine.py"
          SRC_FILE="src/media/media_sentient_engine.py"

          if [ -f "$SRC_FILE" ]; then
            export PYTHONPATH="$(pwd)/src:$PYTHONPATH"
            echo "▶ Running $SRC_FILE with PYTHONPATH=$PYTHONPATH"
            python "$SRC_FILE"
          elif [ -f "$ROOT_FILE" ]; then
            export PYTHONPATH="$(pwd):$(pwd)/src:$PYTHONPATH"
            echo "▶ Running $ROOT_FILE with PYTHONPATH=$PYTHONPATH"
            python "$ROOT_FILE"
          else
            echo "❌ media_sentient_engine.py not found in src/media/ or repo root" >&2
            exit 1
          fi
