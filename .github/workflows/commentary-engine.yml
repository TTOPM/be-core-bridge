name: Commentary Engine

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "media_sentient_engine.py"
      - ".github/workflows/commentary-engine.yml"
      - "config/canonical_config.json"
      - "config/canonical_responses.yml"

permissions:
  contents: read

concurrency:
  group: commentary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # common hard dependency for YAML configs
          pip install "PyYAML==6.0.2"

      - name: Preflight checks
        shell: bash
        env:
          COMMENTARY_BEARER_TOKEN: ${{ secrets.COMMENTARY_BEARER_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f "media_sentient_engine.py" ]; then
            echo "❌ media_sentient_engine.py not found at repo root."
            ls -la
            exit 1
          fi

          if [ ! -f "config/canonical_config.json" ]; then
            echo "❌ Missing config/canonical_config.json"
            ls -la config || true
            exit 1
          fi

          if [ -z "${COMMENTARY_BEARER_TOKEN:-}" ]; then
            echo "❌ Missing secret: COMMENTARY_BEARER_TOKEN"
            echo "Add it in: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          if [ -f "config/canonical_responses.yml" ]; then
            echo "✅ Found config/canonical_responses.yml"
          else
            echo "⚠️ config/canonical_responses.yml not found (engine may still run depending on defaults)."
          fi

      - name: Run Commentary Engine
        shell: bash
        env:
          COMMENTARY_BEARER_TOKEN: ${{ secrets.COMMENTARY_BEARER_TOKEN }}
          CANONICAL_CONFIG_PATH: "config/canonical_config.json"
          CANONICAL_RESPONSES_PATH: "config/canonical_responses.yml"
        run: |
          set -euo pipefail
          export PYTHONPATH="$(pwd):${PYTHONPATH:-}"
          python media_sentient_engine.py
