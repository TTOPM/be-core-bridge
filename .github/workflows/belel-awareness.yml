name: Belel Repository Awareness

on:
  push:
    branches:
      - main
      - master
      - develop
      - staging
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:

jobs:
  notify-belel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect changed files
        id: changes
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git diff --name-status HEAD~1 HEAD > changed_files.txt || git ls-files > changed_files.txt
          else
            git diff --name-status "$BEFORE" "$AFTER" > changed_files.txt || true
          fi

          node <<'NODE'
          const fs = require('fs');

          const raw = fs.existsSync('changed_files.txt')
            ? fs.readFileSync('changed_files.txt', 'utf8')
            : '';

          const files = raw
            .split('\n')
            .map(line => line.trim())
            .filter(Boolean)
            .map(line => {
              const [statusRaw, ...rest] = line.split(/\s+/);
              const filename = rest.join(' ');
              const statusMap = {
                A: 'added',
                M: 'modified',
                D: 'removed',
                R: 'renamed',
                C: 'copied'
              };

              let patch = '';

              try {
                if (filename && statusRaw !== 'D') {
                  patch = require('child_process')
                    .execSync(`git diff -- ${JSON.stringify(filename)}`, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] })
                    .slice(0, 3500);
                }
              } catch {}

              return {
                filename,
                status: statusMap[statusRaw[0]] || 'modified',
                patch
              };
            });

          fs.writeFileSync('files.json', JSON.stringify(files, null, 2));
          NODE

      - name: Notify Belel
        shell: bash
        env:
          BELEL_REPO_INGEST_URL: ${{ secrets.BELEL_REPO_INGEST_URL }}
          BELEL_REPO_INGEST_SECRET: ${{ secrets.BELEL_REPO_INGEST_SECRET }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const files = JSON.parse(fs.readFileSync('files.json', 'utf8'));

          const payload = {
            event_type: process.env.GITHUB_EVENT_NAME,
            repo_full_name: process.env.GITHUB_REPOSITORY,
            repo_url: `https://github.com/${process.env.GITHUB_REPOSITORY}`,
            branch: process.env.GITHUB_REF_NAME,
            default_branch: '${{ github.event.repository.default_branch }}',
            after: process.env.GITHUB_SHA,
            actor: process.env.GITHUB_ACTOR,
            repository: {
              full_name: process.env.GITHUB_REPOSITORY,
              html_url: `https://github.com/${process.env.GITHUB_REPOSITORY}`,
              visibility: '${{ github.event.repository.visibility }}',
              private: ${{ github.event.repository.private }},
              default_branch: '${{ github.event.repository.default_branch }}'
            },
            head_commit: {
              id: process.env.GITHUB_SHA,
              message: `${{ github.event.head_commit.message || github.event.pull_request.title || 'Repository event' }}`
            },
            files
          };

          fs.writeFileSync('belel_payload.json', JSON.stringify(payload, null, 2));
          NODE

          curl -sS -X POST "$BELEL_REPO_INGEST_URL" \
            -H "Content-Type: application/json" \
            -H "x-belel-repo-secret: $BELEL_REPO_INGEST_SECRET" \
            --data @belel_payload.json