name: Belel Core Defender (Gate)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "**/*.py"
      - "code_hashes.json"
      - "canonical_config.json"
      - "mutation_watcher.py"
      - "belel_guardian.py"
      - "claim_review_publisher.py"
      - "concordium_enforcer.py"
      - "media_sentient_engine.py"
      - "BELEL_PROTOCOL_OVERVIEW.md"
      - "requirements-defender.txt"
      - ".github/workflows/defender.yml"
  push:
    branches: [ "main" ]
    paths:
      - "**/*.py"
      - "code_hashes.json"
      - "canonical_config.json"
      - "mutation_watcher.py"
      - "belel_guardian.py"
      - "claim_review_publisher.py"
      - "concordium_enforcer.py"
      - "media_sentient_engine.py"
      - "BELEL_PROTOCOL_OVERVIEW.md"
      - "requirements-defender.txt"
      - ".github/workflows/defender.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: defender-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (defender)
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f requirements-defender.txt ]; then
            pip install -r requirements-defender.txt
          else
            pip install requests filelock
          fi

      - name: Run Defender (Gate)
        run: |
          set -e
          python be_core_defender.py --mode gate --strict --out defender_report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defender-gate-${{ github.run_id }}
          path: defender_report.json
          retention-days: 14
