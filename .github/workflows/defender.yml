name: Belel Core Defender

on:
  push:
    branches: [ "main" ]
    paths:
      - "be_core_defender.py"
      - "mutation_watcher.py"
      - "belel_guardian.py"
      - "concordium_enforcer.py"
      - "claim_review_publisher.py"
      - "media_sentient_engine.py"
      - "code_hashes.json"
      - "canonical_config.json"
      - "requirements-defender.txt"
      - "**/*.py"
      - "BELEL_PROTOCOL_OVERVIEW.md"
  pull_request:
    branches: [ "main" ]
    paths:
      - "be_core_defender.py"
      - "mutation_watcher.py"
      - "belel_guardian.py"
      - "concordium_enforcer.py"
      - "claim_review_publisher.py"
      - "media_sentient_engine.py"
      - "code_hashes.json"
      - "canonical_config.json"
      - "requirements-defender.txt"
      - "**/*.py"
      - "BELEL_PROTOCOL_OVERVIEW.md"
  schedule:
    - cron: "0 * * * *"  # hourly drift sweep (not every 5 minutes)
  workflow_dispatch:

concurrency:
  group: defender-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-defender:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-defender.txt

      - name: Preflight: required files present
        run: |
          set -e
          test -f requirements-defender.txt
          test -f be_core_defender.py
          echo "✅ preflight ok"

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements-defender.txt

      - name: Run Belel Core Defender
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          python be_core_defender.py
