name: Verify • Sign • (Pin)

on:
  push:
  workflow_dispatch:

jobs:
  verify-sign-pin:
    runs-on: ubuntu-latest

    env:
      # Optional signing
      ED25519_PRIV_B64: ${{ secrets.ED25519_PRIV_B64 }}

      # Optional IPFS pinning
      ENABLE_IPFS_PIN: ${{ vars.ENABLE_IPFS_PIN }}
      PINATA_JWT: ${{ secrets.PINATA_JWT }}
      IPFS_API_MULTIADDR: /ip4/127.0.0.1/tcp/5001/http

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📦 Install verifier extras (HTML / manifest parsing)
        run: |
          pip install beautifulsoup4==4.12.3 lxml==5.2.2

      - name: 🔐 Run verification, signing, and optional pinning
        run: |
          python verify_all.py

      - name: 📤 Upload attestations
        uses: actions/upload-artifact@v4
        with:
          name: attestations
          path: attestations/*.json
